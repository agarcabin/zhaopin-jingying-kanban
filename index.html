<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创新招聘组 · 综合工作台</title>
  <link rel="stylesheet" href="./task-preview.css">
  <script src="./task-preview.js" defer></script>
  <link rel="stylesheet" href="./positions.css">
  <script src="./positions.js" defer></script>
  <style>
    :root{--bg:#f4f6f9;--surface:#fff;--text:#172b43;--muted:#53647a;--line:#dfe5ed;--blue:#1762aa;--tint:#eaf3ff;--green:#087957}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button,a{touch-action:manipulation}
    header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 32px}.top{max-width:1800px;margin:auto;display:flex;align-items:center;gap:32px;min-height:80px;flex-wrap:wrap}.brand{font-size:18px;font-weight:750;white-space:nowrap}.brand span{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;background:var(--blue);color:white;border-radius:8px;font-size:16px}
    nav{display:flex;gap:8px;flex-wrap:wrap}nav button{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:11px 19px;min-height:44px;font-weight:600}nav button:hover{background:var(--bg)}nav button[aria-pressed="true"]{background:var(--tint);color:var(--blue)}.prototype{margin-left:auto;font-size:12px;border:1px solid var(--line);padding:3px 10px;border-radius:20px;color:var(--muted)}
    main{max-width:1864px;margin:0 auto;padding:24px 32px}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);margin:0 0 4px}h1{font-size:24px;line-height:1.4;margin:0 0 4px}p{margin:0;color:var(--muted)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-decoration:none;white-space:nowrap}.action:hover{border-color:var(--blue);color:var(--blue)}
    .viewer{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.viewer-bar{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;flex-shrink:0;border-radius:50%;background:var(--blue)}.source{margin-left:auto;color:var(--muted);text-decoration:none}.source:hover{text-decoration:underline}.frame-wrap{height:calc(100dvh - 310px);min-height:480px;position:relative}iframe{width:100%;height:100%;border:0;display:block;background:white}#placeholder{min-height:480px;display:grid;place-content:center;padding:32px;text-align:center}#placeholder[hidden],#dashboard[hidden]{display:none}#placeholder .number{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 18px;border-radius:16px;color:var(--blue);background:var(--tint);font-size:24px;font-weight:700}h2{font-size:22px;margin:0 0 10px}.note{margin-top:14px;font-size:13px;color:var(--muted)}.note strong{font-weight:600;color:var(--text)}
    @media(max-width:700px){header{padding:16px}.top{gap:14px;min-height:auto}.prototype{margin-left:auto}nav{order:3;width:100%;gap:4px}nav button{padding:10px 12px;flex:1;font-size:14px}main{padding:20px 12px}.heading{align-items:flex-start;flex-direction:column}h1{font-size:22px}.frame-wrap{height:70dvh;min-height:420px}.source{margin-left:20px}.viewer-bar{gap:8px;padding:12px}}
  </style>
</head>
<body>
  <header><div class="top">
    <div class="brand"><span aria-hidden="true">招</span>创新招聘组</div>
    <nav aria-label="工作台导航">
      <button type="button" data-page="dashboard" aria-pressed="true">招聘过程看板</button>
      <button type="button" data-page="tasks" aria-pressed="false">AI 开发进度</button>
      <button type="button" data-page="positions" aria-pressed="false">岗位信息收集</button>
    </nav>
    <span class="prototype">招聘工作台</span>
  </div></header>
  <main>
    <div class="heading"><div><p class="eyebrow">RECRUITMENT WORKSPACE</p><h1 id="page-title">招聘过程看板</h1><p id="page-description">在统一工作台中查看招聘全过程。</p></div>
      <div class="actions" id="dashboard-actions"><button class="action" id="reload" type="button">重新加载</button><a class="action" id="open-source" target="_blank" rel="noopener noreferrer">打开源表格 ↗</a></div>
    </div>
    <section class="viewer" id="main-viewer" aria-labelledby="page-title">
      <div id="dashboard">
        <div class="viewer-bar"><span class="dot" aria-hidden="true"></span><span id="load-status" role="status">快照日期：读取中…</span><a class="source" id="source-link" target="_blank" rel="noopener noreferrer">来源：企微在线表格 ↗</a></div>
        <div class="frame-wrap"><iframe id="workbuddy-frame" title="创新招聘组 招聘过程看板" allow="fullscreen" allowfullscreen></iframe></div>
      </div>
    </section>
    <section id="task-panel" hidden aria-labelledby="page-title">
      <div class="task-loading" role="status">正在加载任务快照…</div>
    </section>
    <section id="positions-panel" hidden aria-labelledby="page-title"></section>
    <p class="note" id="embed-note"><strong>页面说明：</strong>看板数据由《创新招聘组数据》企微在线表格实时快照生成，邀约/入职/企微/简历与月度日报同一套口径；任务与资料为只读副本，链接权限由原文档决定。</p>
  </main>
  <script>
    // 三个页面分别展示招聘过程、滴答开发进度和文档入口。
    const WORKBUDDY_URL = 'https://doc.weixin.qq.com/sheet/e3_AQsA_wYCAFMCNYd3nGEL1QQ6zjpQz';
    const DASHBOARD_URL = './embeds/dashboard.html';
    const pages = {
      dashboard: {title: '招聘过程看板', description: '在统一工作台中查看招聘全过程。'},
      tasks: {title: 'AI 开发进度', description: '月度排期与项目任务，集中查看。'},
      positions: {title: '岗位信息收集', description: '企业招聘采集清单与团队数据，集中查阅。'}
    };
    const frame = document.getElementById('workbuddy-frame');
    const status = document.getElementById('load-status');
    let timeout;
    function loadDashboard() {
      clearTimeout(timeout);
      status.textContent = '数据加载中…';
      frame.src = DASHBOARD_URL;
      timeout = setTimeout(() => {status.textContent = '加载超时，请点「重新加载」。';}, 18000);
    }
    frame.addEventListener('load', () => {
      if (!frame.getAttribute('src')) return;
      clearTimeout(timeout);
      // 同站副本可检查实际内容，避免把错误文档的 load 事件当作成功。
      const content = frame.contentDocument;
      const hasDashboard = content && content.querySelector('#daypick') && content.querySelector('#hourglass');
      const meta = content?.defaultView?.__DATA__?.meta;
      const src = meta?.wecom_source || {};
      const detailDays = Object.values(src).filter(x => x && Object.values(x).includes('detail')).length;
      status.textContent = hasDashboard && meta
        ? `数据截至 ${meta.latest_report} · 生成 ${meta.generated_at} · 企微明细口径 ${detailDays} 天`
        : '看板内容校验失败，请点「重新加载」。';
    });
    frame.addEventListener('error', () => {clearTimeout(timeout);status.textContent = '加载失败，请点「重新加载」。';});
    function showPage(key) {
      const page = pages[key] || pages.dashboard;
      const isDashboard = page === pages.dashboard;
      const isTasks = page === pages.tasks;
      const isPositions = page === pages.positions;
      document.body.dataset.page = isTasks ? 'tasks' : isPositions ? 'positions' : 'dashboard';
      document.querySelectorAll('[data-page]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.page === (pages[key] ? key : 'dashboard'))));
      document.getElementById('page-title').textContent = page.title;
      document.getElementById('page-description').textContent = page.description;
      document.getElementById('dashboard').hidden = !isDashboard;
      document.getElementById('main-viewer').hidden = !isDashboard;
      document.getElementById('task-panel').hidden = !isTasks;
      document.getElementById('positions-panel').hidden = !isPositions;
      document.getElementById('dashboard-actions').style.display = isDashboard ? '' : 'none';
      document.getElementById('embed-note').hidden = !isDashboard;
      if (isTasks) document.dispatchEvent(new Event('task-preview:open'));
      if (isPositions) document.dispatchEvent(new Event('positions:open'));
    }
    document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => {location.hash = button.dataset.page;}));
    window.addEventListener('hashchange', () => showPage(location.hash.slice(1)));
    document.getElementById('reload').addEventListener('click', loadDashboard);
    document.getElementById('open-source').href = WORKBUDDY_URL;
    document.getElementById('source-link').href = WORKBUDDY_URL;
    showPage(location.hash.slice(1));
    loadDashboard();
  </script>
</body>
</html>
